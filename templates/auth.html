{% extends 'base_commerce.html' %}{% block content %}<section class="panel narrow"><h1>{{ 'Реєстрація' if register else 'Вхід до Chaplin' }}</h1><form method="post" action="{{ url_for('singup') if register else url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if register %}<label>Ім’я<input name="first_name" required maxlength="50" autocomplete="given-name"></label><label>Прізвище<input name="last_name" required maxlength="50" autocomplete="family-name"></label><label>Email<input name="email" type="email" required maxlength="100" autocomplete="email"></label>{% endif %}<label>Логін<input name="login" required maxlength="100" autocomplete="username"></label><label>Пароль<input name="password" type="password" required minlength="{{ 10 if register else 1 }}" maxlength="200" autocomplete="{{ 'new-password' if register else 'current-password' }}"></label><button>{{ 'Створити обліковий запис' if register else 'Увійти' }}</button></form><p><a href="{{ url_for('login') if register else url_for('singup') }}">{{ 'Уже маєте обліковий запис? Увійти' if register else 'Створити обліковий запис' }}</a></p></section>{% endblock %}
