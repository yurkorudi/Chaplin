{% extends 'base_commerce.html' %}{% block content %}<section class="panel split"><img class="product-image" src="{{ product.image }}" alt="{{ product.name }}"><div><p class="eyebrow">{{ product.category.name }}</p><h1>{{ product.name }}</h1><p>{{ product.description }}</p><p class="total">{{ '%.2f'|format(product.price) }} грн</p><p>Наявність у демокаталозі: {{ product.stock }} шт.</p><form method="post" action="/cart/update"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="product_id" value="{{ product.id }}"><label>Кількість<input name="quantity" type="number" min="1" max="{{ [product.stock,20]|min }}" value="1" required></label><button {% if product.stock==0 %}disabled{% endif %}>Додати в кошик</button></form></div></section>{% endblock %}
