{% extends 'base_commerce.html' %}{% block content %}<section class="panel narrow"><h1>Новий сеанс</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>1. Місто<select name="city" id="session-city">{% for city in cities %}<option>{{ city }}</option>{% endfor %}</select></label><label>2. Кінотеатр<select name="cinema_id" id="session-cinema">{% for cinema in cinemas %}<option value="{{ cinema.cinema_id }}" data-city="{{ cinema.city }}">{{ cinema.name }}</option>{% endfor %}</select></label><label>3. Зал<select name="hall_id" id="session-hall">{% for hall in halls %}<option value="{{ hall.id }}" data-cinema="{{ hall.cinema_id }}">{{ hall.name }}</option>{% endfor %}</select></label><label>4. Фільм<select name="film_id">{% for film in films %}<option value="{{ film.film_id }}">{{ film.name }} · {{ film.duration }} хв</option>{% endfor %}</select></label><label>5. Початок<input type="datetime-local" name="start" required></label><label>6. Звичайне місце, грн<input type="number" name="price" min="1" max="99999" step=".01" value="150" required></label><p class="muted">VIP × 1,5. Підготовка залу — 15 хв. Конфлікти перевіряються сервером.</p><button>Зберегти сеанс</button></form></section><script>const city=document.querySelector('#session-city'),cinema=document.querySelector('#session-cinema'),hall=document.querySelector('#session-hall');function halls(){let first;[...hall.options].forEach(o=>{o.hidden=o.disabled=o.dataset.cinema!==cinema.value;if(!o.disabled&&!first)first=o;});if(first)hall.value=first.value;}function cinemas(){let first;[...cinema.options].forEach(o=>{o.hidden=o.disabled=o.dataset.city!==city.value;if(!o.disabled&&!first)first=o;});if(first)cinema.value=first.value;halls();}city.addEventListener('change',cinemas);cinema.addEventListener('change',halls);cinemas();</script>{% endblock %}
